[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sprint"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.4",
    "faiss-cpu==1.12.0",
    "scikit-learn==1.7.2",
    "k-means-constrained==0.7.6",
    "matplotlib==3.10.7",
]

[tool.hatch.build]
include = [
    "py/**/*",
]
exclude = [
    "**/__pycache__/*"
]
